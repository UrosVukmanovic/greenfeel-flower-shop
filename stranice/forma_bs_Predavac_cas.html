<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
    .form-group{
    margin-top:30px;
    }
    </style>
    <title>Forma za kreiranje naloga</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
        <div class="col-md-6">
        <h1>Leve kontrole</h1>
        <form action="#" method="post">
        <div class="form-group">
        <label for="ime">Ime:</label>
        <input type="text" class="form-control" id="ime" name="ime" placeholder="vase ime:">
        </div>
        <div class="form-group">
        <label for="prezime">Prezime:</label>
        <input type="text" class="form-control" id="prezime" name="prezime" placeholder="vase prezime:">
        </div>
        <div class="form-group">
        <label for="korisnicko_ime">Korisnicko_ime:</label>
        <input type="text" class="form-control" id="korisnicko_ime" name="korisnicko_ime" placeholder="vase korisnicko_ime:">
        </div>
        <div class="form-group">
        <label for="lozinka">Lozinka:</label>
        <input type="password" class="form-control" id="lozinka" name="lozinka" placeholder="vase lozinka:">
        </div>
        </form>
        </div>
        <div class="col-md-6">
        <h1>Desna kontrola</h1>
        <form action="#" method="post">
        <div class="form-group">
        <label for="datum">Datum rodjenja</label>
        <input type="date" class="form-control" id="datum" name="datum">
        </div>
        <div class="form-group">
        <label for="pozicija">Izaberite poziciju</label>
        <select name="pozicija" id="pozicija">
        <option value="programer">Programer</option>
        <option value="doktor">Doktor</option>  
        <option value="pedijatar">Pedijatar</option>
        </select>
        </div>
        <div class="form-group">
        <label for="pol">Izaberite pol </label><br>
        <input type="checkbox" id="muski" name="pol" value="muski">
        <label for="muski">Muski</label><br>
        <input type="checkbox" id="zenski" name="pol" value="zenski">
        <label for="zenski">Zenski</label>
        </div>
        <div class="form-group">
        <label for="dokument">Izaberite dokument</label><br>
        <input type="file" id="dokument" class="form-control-file">
        </div>
        <div class="form-group">
        <button type="submit" class="btn btn-danger btn-lg">Posalji podatke</button>
        </div>
        </form>
        </div>
        </div>
        </div>
    </body>






</html>
